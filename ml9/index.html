<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Nine ML algorithms — 9대 ML 알고리즘 모션</title>
<style>
:root{
  --bg:#E7EAEF; --ink:#111827; --mute:#6B7280; --soft:#EFF1F4; --line:#D9DEE5;
  --A:#EF4444; --B:#2563EB; --P:#9331E9; --Y:#F59E0B; --G:#0D9488;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{scroll-padding-top:92px}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;font-size:12.5px;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:5px 9px;border-radius:5px;cursor:pointer;line-height:1.25;white-space:nowrap;transition:background .12s,color .12s}
button:hover{background:#F3F4F6}
button.on{background:var(--ink);color:#fff}
button.acc{border-color:var(--P);color:var(--P);font-weight:700}
button.acc:hover{background:#F6F0FE}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--ink)}
.bar{max-width:1460px;margin:0 auto;padding:11px 16px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.35px;flex:1 1 340px;line-height:1.25}
h1 .em{font-weight:500;color:var(--mute);font-size:13.5px;letter-spacing:0}
.ctrl{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pbox{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#FCFCFD}
.plab{font-size:11.5px;color:var(--mute)}
.pbox input[type=range]{width:104px;accent-color:var(--P)}
.pval{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;color:var(--P);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.hint{max-width:1460px;margin:0 auto;padding:0 16px 8px;font-size:12px;color:var(--mute);line-height:1.5}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px;max-width:1460px;margin:0 auto;align-items:start}
.card{background:#fff;border:1px solid var(--ink);display:flex;flex-direction:column;min-width:0;position:relative;cursor:zoom-in;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:5px 5px 0 rgba(17,24,39,.07)}
.hd{display:flex;align-items:center;gap:8px;padding:9px 12px 0}
.num{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:3px;padding:2px 5px;letter-spacing:.5px;flex:none}
.ttl{font-weight:800;font-size:15px;letter-spacing:-.2px;flex:1;min-width:0;word-break:keep-all}
.ttl small{font-weight:500;color:var(--mute);font-size:12px;margin-left:5px;letter-spacing:0}
.backbtn{display:none;padding:3px 8px;font-size:12px}
.zoom{font-size:12px;color:#9CA3AF;opacity:0;transition:opacity .15s;flex:none}
.card:hover .zoom{opacity:1}
body.focus .zoom{display:none}
.fx{padding:3px 12px 8px;font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:16px;min-height:27px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;color:#0F172A}
.fx b{font-weight:600}
.fx sup{font-size:.72em}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;border-top:1px dashed var(--soft);border-bottom:1px dashed var(--soft);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#fff}
.ft{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 12px 2px}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--mute);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}
.use{padding:2px 12px 10px;font-size:11.5px;color:var(--mute);line-height:1.5}
.use b{color:var(--ink);font-weight:600}
.params{display:none;gap:16px;flex-wrap:wrap;padding:9px 12px;border-top:1px dashed var(--soft);background:#FAFBFC;cursor:default}
.prm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);white-space:nowrap;flex-wrap:nowrap;max-width:100%}
.prm .pn{white-space:nowrap}
.prm input[type=range]{width:158px;min-width:60px;accent-color:var(--P)}
.prm .pv{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px;color:var(--P);min-width:46px;font-variant-numeric:tabular-nums}
.long{display:none;padding:2px 14px 10px;font-size:13px;line-height:1.72;color:#374151;max-width:900px}
.long b{color:var(--ink)}
.nav{display:none;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--soft)}
.navmid{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
footer{max-width:1460px;margin:0 auto;padding:2px 16px 28px;font-size:11.5px;color:var(--mute);line-height:1.7}
footer p{margin:0 0 4px}

/* focus */
body.focus main{grid-template-columns:minmax(0,1fr);max-width:1240px;padding-top:18px;padding-bottom:28px}
body.focus .card:not(.focused){display:none}
body.focus .card{cursor:default}
body.focus .card:hover{box-shadow:none}
body.focus .card.focused{box-shadow:7px 7px 0 rgba(17,24,39,.06)}
body.focus .focused .hd{padding:14px 20px 0;gap:10px}
body.focus .focused .num{font-size:12px;padding:3px 7px}
body.focus .focused .ttl{font-size:23px;letter-spacing:-.5px}
body.focus .focused .ttl small{font-size:14px}
body.focus .focused .backbtn{display:inline-block}
body.focus .focused .fx{font-size:23px;padding:6px 20px 12px;min-height:38px}
body.focus .focused canvas{aspect-ratio:16/9;max-height:52vh;min-height:240px}
body.focus .focused .ft{padding:12px 20px 2px}
body.focus .focused .val{font-size:22px}
body.focus .focused .sub{font-size:12.5px}
body.focus .focused .use{padding:2px 20px 8px;font-size:12.5px}
body.focus .focused .params{display:flex;padding:12px 20px;gap:22px}
body.focus .focused .prm input[type=range]{width:230px}
body.focus .focused .prm .pv{min-width:56px;font-size:13px}
body.focus .focused .long{display:block;padding:4px 20px 14px;font-size:13.5px}
body.focus .focused .nav{display:flex}
body.focus footer{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;padding:26px 16px;overflow:auto}
body.modal-open .modal{display:flex;align-items:flex-start;justify-content:center}
.msheet{background:#fff;border:1px solid var(--ink);width:100%;max-width:1000px;box-shadow:8px 8px 0 rgba(0,0,0,.18)}
.mhead{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--ink);z-index:2}
.mhead h2{margin:0;font-size:17px;letter-spacing:-.3px}
.mbody{display:block;padding-bottom:54px}
.mrow{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:13px 18px;border-bottom:1px dashed var(--soft)}
.mrow:last-child{border-bottom:0}
.mnum{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:#fff;background:var(--ink);height:19px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.mname{font-weight:800;font-size:14.5px}
.mname small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px}
.mfx{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:15px;margin:3px 0 5px;overflow-x:auto;white-space:nowrap}
.mdesc{font-size:12.5px;line-height:1.65;color:#374151}
.mprm{font-size:11.5px;color:var(--P);margin-top:4px}
.mfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--ink);padding:11px 18px;font-size:11.5px;color:var(--mute);line-height:1.6}

@media(max-width:1080px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){
  header{position:static}
  .ttl small{display:block;margin-left:0}
  .prm input[type=range]{width:120px}
  .bar{padding:10px 12px 7px;gap:8px}
  h1{font-size:16px;flex-basis:100%}
  h1 .em{font-size:12px}
  .ctrl{gap:5px}
  button{font-size:12px;padding:5px 7px}
  .pbox input[type=range]{width:78px}
  main{grid-template-columns:1fr;padding:10px;gap:10px}
  .fx{font-size:15px}
  body.focus .focused .ttl{font-size:18px}
  body.focus .focused .fx{font-size:17px;padding:6px 14px 10px}
  body.focus main{padding:10px}
  .prm input[type=range]{width:130px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Nine ML algorithms <span class="em" data-k="h1b"></span></h1>
    <div class="ctrl">
      <button id="play" class="on"></button>
      <button id="reset" data-k="reset"></button>
      <div class="pbox">
        <span class="plab" data-k="speed"></span>
        <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" aria-label="speed">
        <span class="pval" id="spv">1.0×</span>
      </div>
      <button id="view"></button>
      <button id="lang"></button>
      <button id="help" data-k="help"></button>
    </div>
  </div>
  <div class="hint" id="hint" data-k="hint"></div>
</header>

<main id="grid"></main>
<footer>
  <p data-k="foot"></p>
  <p data-k="foot2"></p>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="msheet">
    <div class="mhead"><h2 data-k="mTitle"></h2><button id="mclose" aria-label="close">✕</button></div>
    <div class="mbody" id="mbody"></div>
    <div class="mfoot" data-k="mFoot"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   Nine ML algorithms — motion playground
   Canvas 2D · Vanilla JS · requestAnimationFrame · single file
   ========================================================================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const easeIO = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const easeOut = t => 1-Math.pow(1-t,3);
const F = (v,d=2) => (isFinite(v)?v:0).toFixed(d);
const sig = z => 1/(1+Math.exp(-clamp(z,-30,30)));
const TAU = Math.PI*2;
const ko = () => S.lang === 'ko';

const C = {ink:'#111827', mute:'#6B7280', grid:'#F0F2F5', axis:'#E1E5EA',
           A:'#EF4444', B:'#2563EB', P:'#9331E9', Y:'#F59E0B', G:'#0D9488',
           T:'#14B8A6', K:'#EC4899', gray:'#94A3B8'};
const PAL = ['#9331E9','#F59E0B','#0D9488','#EC4899','#2563EB'];
const RGB = {A:[239,68,68], B:[37,99,235], W:[255,255,255]};

/* ---------- seeded random ---------- */
let SEED = 7331;
const newSeed = () => (SEED = (SEED*48271) % 2147483647);
function RNG(seed){ this.s = (seed>>>0) || 1; }
RNG.prototype.next = function(){
  let a = this.s = (this.s + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a>>>15), 1 | a);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
  return ((t ^ (t>>>14)) >>> 0) / 4294967296;
};
RNG.prototype.g = function(){
  let u=0, v=0; while(!u) u=this.next(); while(!v) v=this.next();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(TAU*v);
};
RNG.prototype.range = function(a,b){ return a + (b-a)*this.next(); };

function makePts(r, n, cx, cy, sx, sy, rot, c){
  const out = [], co = Math.cos(rot), si = Math.sin(rot);
  for(let i=0;i<n;i++){
    const gx = r.g()*sx, gy = r.g()*sy;
    out.push({ x: cx + gx*co - gy*si, y: cy + gx*si + gy*co, c });
  }
  return out;
}

/* ---------- text ---------- */
const S = { lang:'ko', playing:true, speed:1, focus:null };
const T = {
 ko:{
  h1b:'— 9대 ML 알고리즘이 자기 데이터 위에서 학습하고 수렴하는 모션',
  play:'⏸ 일시정지', paused:'▶ 재생', reset:'↺ 리셋', speed:'속도', help:'∑ 수식·해설', lang:'🌐 English',
  hint:'카드를 누르면 확대되고 파라미터를 직접 조작할 수 있습니다 · Space 재생/일시정지 · ←/→ 카드 이동 · Esc 닫기',
  viewGrid:'⤢ 확대 보기', viewFocus:'▦ 9개 그리드', back:'← 그리드',
  mTitle:'9대 ML 알고리즘 — 수식과 해설',
  mFoot:'색상 규칙 — 보라: 모델(결정 경계·주축·중심) / 빨강·파랑: 두 클래스 / 주황: 하이퍼파라미터·서포트 벡터. 모든 애니메이션은 브라우저 Canvas 2D에서 실시간으로 계산되며 외부 라이브러리를 쓰지 않습니다.',
  foot:'원작 아이디어: X @mathemetica — “Nine ML algorithms, each running on its own data”. 선형·로지스틱 회귀와 SVM은 경사하강법, k-means는 로이드 반복, 결정 트리는 지니 불순도 최소 분할, 랜덤 포레스트는 부트스트랩+무작위 특징, 나이브 베이즈는 가우시안 우도로 학습합니다.',
  foot2:'수업용 단일 HTML · 오프라인에서도 동작 · 모든 수치는 브라우저에서 실시간 계산값입니다.',
  prev:'‹ 이전', next:'다음 ›', of:'/',
  clickHint:'클릭 확대'
 },
 en:{
  h1b:'— each converging on its own data, live in the browser',
  play:'⏸ Pause', paused:'▶ Play', reset:'↺ Reset', speed:'Speed', help:'∑ Formulas', lang:'🌐 한국어',
  hint:'Click any card to focus it and tweak its parameters · Space play/pause · ←/→ navigate · Esc close',
  viewGrid:'⤢ Focus view', viewFocus:'▦ 9-up grid', back:'← Grid',
  mTitle:'Nine ML algorithms — formulas & notes',
  mFoot:'Colour code — purple: model (boundary, principal axis, centroids) / red & blue: the two classes / amber: hyper-parameters and support vectors. Every animation is computed live with Canvas 2D, no libraries.',
  foot:'Original idea: X @mathemetica — “Nine ML algorithms, each running on its own data”. Linear & logistic regression and the SVM use gradient descent; k-means uses Lloyd iterations; the tree uses greedy Gini splits; the forest uses bootstrap + random features; Naive Bayes fits Gaussians.',
  foot2:'Single-file teaching app · works offline · every number is computed live in the browser.',
  prev:'‹ Prev', next:'Next ›', of:'/',
  clickHint:'click to focus'
 }
};

/* ---------- canvas plumbing ---------- */
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
function fit(cv){
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height){ cv._w = 0; cv._h = 0; return; }
  const dpr = DPR();
  cv._w = r.width; cv._h = r.height;
  cv.width = Math.round(r.width*dpr);
  cv.height = Math.round(r.height*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cv._ctx = ctx;
  cv._f = {};
}
const U = cv => clamp(.60 + .40*(cv._w/458), .80, 1.75);

/* world window: x ±2.4, y ±1.5 (uniform scale, no distortion) */
const WX = 2.4, WY = 1.3;
function tf(cv){
  const w = cv._w, h = cv._h;
  const sc = Math.min(w/(2*WX), h/(2*WY));
  const cx = w/2, cy = h/2;
  return {
    sc, cx, cy, w, h,
    f:(x,y)=>({x:cx + x*sc, y:cy - y*sc}),
    inv:(px,py)=>({x:(px-cx)/sc, y:(cy-py)/sc})
  };
}

/* ---------- drawing primitives ---------- */
function bg(ctx, cv, t, big){
  const w = cv._w, h = cv._h;
  ctx.save();
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for(let gx=-3; gx<=3.001; gx+=.5){ const x = t.f(gx,0).x; ctx.moveTo(x,0); ctx.lineTo(x,h); }
  for(let gy=-2; gy<=2.001; gy+=.5){ const y = t.f(0,gy).y; ctx.moveTo(0,y); ctx.lineTo(w,y); }
  ctx.stroke();
  ctx.strokeStyle = C.axis; ctx.beginPath();
  const ax = t.f(0,0).x, ay = t.f(0,0).y;
  if(ax>0 && ax<w){ ctx.moveTo(ax,0); ctx.lineTo(ax,h); }
  if(ay>0 && ay<h){ ctx.moveTo(0,ay); ctx.lineTo(w,ay); }
  ctx.stroke();
  if(big){
    const u = U(cv);
    for(const v of [-2,-1,0,1,2]){
      const p = t.f(v, -1.5);
      if(p.x > 14*u && p.x < w-14*u) lab(ctx, String(v), p.x, h-7*u, {size:9.5*u, color:'#9AA1AE', base:'bottom'});
    }
    for(const v of [-1,1]){
      const p = t.f(-2.4, v);
      lab(ctx, String(v), 7*u, p.y, {size:9.5*u, color:'#9AA1AE', align:'left'});
    }
  }
  ctx.restore();
}
function line(ctx,x1,y1,x2,y2,color,w=1,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=w; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function dot(ctx,x,y,r,fill,stroke='#fff',lw=1.5){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke(); }
}
function ring(ctx,x,y,r,color,w=2){
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke(); ctx.restore();
}
function lab(ctx,s,x,y,o={}){
  const size = o.size || 11;
  ctx.save();
  ctx.font = `${o.w||600} ${size}px ${o.mono===false?'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif':'ui-monospace,SFMono-Regular,Menlo,monospace'}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if(o.halo !== false){
    ctx.lineWidth = Math.max(3, size*.36); ctx.strokeStyle = 'rgba(255,255,255,.94)';
    ctx.lineJoin = 'round'; ctx.strokeText(s,x,y);
  }
  ctx.fillStyle = o.color || C.ink; ctx.fillText(s,x,y);
  ctx.restore();
}
function chip(ctx,cv,text,x,y,o={}){
  const u = U(cv);
  ctx.save();
  ctx.font = `700 ${(o.size||10.5)*u}px ui-monospace,SFMono-Regular,Menlo,monospace`;
  const tw = ctx.measureText(text).width;
  const h = (o.h||17)*u, pad = 6*u;
  const w = tw + pad*2;
  const left = o.align==='right' ? x-w : x;
  ctx.fillStyle = o.bg || 'rgba(255,255,255,.9)';
  ctx.strokeStyle = o.border || C.axis; ctx.lineWidth = 1;
  const r = 3*u;
  ctx.beginPath();
  ctx.moveTo(left+r,y); ctx.lineTo(left+w-r,y); ctx.quadraticCurveTo(left+w,y,left+w,y+r);
  ctx.lineTo(left+w,y+h-r); ctx.quadraticCurveTo(left+w,y+h,left+w-r,y+h);
  ctx.lineTo(left+r,y+h); ctx.quadraticCurveTo(left,y+h,left,y+h-r);
  ctx.lineTo(left,y+r); ctx.quadraticCurveTo(left,y,left+r,y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = o.color || C.ink; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(text, left+pad, y+h/2+.5);
  ctx.restore();
}
function spark(ctx,x,y,w,h,data,color){
  if(!data || data.length<2) return;
  let mn=Infinity, mx=-Infinity;
  for(const v of data){ if(v<mn)mn=v; if(v>mx)mx=v; }
  if(mx-mn < 1e-6) mx = mn + 1e-6;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.strokeStyle='#E5E7EB'; ctx.lineWidth=1;
  ctx.fillRect(x,y,w,h); ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.beginPath();
  data.forEach((v,i)=>{
    const px = x + w*i/(data.length-1);
    const py = y + h - (v-mn)/(mx-mn)*(h-3) - 1.5;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);

}
function bar(ctx,x,y,w,h,frac,color,bgColor='#EDEFF3'){

  ctx.fillStyle=bgColor; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=color; ctx.fillRect(x,y,Math.max(0,Math.min(1,frac))*w,h);

/* ---------- decision-field helper ---------- */
function fieldOf(cv,tag){
  cv._f = cv._f || {};
  if(!cv._f[tag]) cv._f[tag] = {cv:document.createElement('canvas'), key:'', pmap:null, nx:0, ny:0};
  return cv._f[tag];
}
function paintField(ctx, cv, tag, key, t, sampler, o={}){
  const f = fieldOf(cv, tag);
  const nx = o.nx || Math.max(24, Math.round(cv._w/6));
  const ny = o.ny || Math.max(18, Math.round(cv._h/6));
  if(f.key !== key){
    f.cv.width = nx; f.cv.height = ny; f.nx = nx; f.ny = ny; f.key = key;
    const c = f.cv.getContext('2d');
    let pm = new Float32Array(nx*ny);
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const wx = t.inv((i+.5)/nx*cv._w, (j+.5)/ny*cv._h);
      pm[j*nx+i] = clamp(sampler(wx.x, wx.y), 0, 1);
    }
    if(o.smooth){
      const bl = new Float32Array(nx*ny), R = o.smooth===true?1:o.smooth;
      for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
        let s=0, n=0;
        for(let dj=-R;dj<=R;dj++) for(let di=-R;di<=R;di++){
          const jj=j+dj, ii=i+di;
          if(jj<0||jj>=ny||ii<0||ii>=nx) continue;
          s += pm[jj*nx+ii]; n++;
        }
        bl[j*nx+i] = s/n;
      }
      pm = bl;
    }
    const img = c.createImageData(nx, ny);
    for(let i2=0;i2<nx*ny;i2++){
      const p = pm[i2];
      const a = (o.base ?? .045) + (o.amp ?? .20)*Math.abs(2*p-1);
      const col = p>=.5 ? RGB.B : RGB.A;
      const k = i2*4;
      img.data[k]   = Math.round(255*(1-a) + col[0]*a);
      img.data[k+1] = Math.round(255*(1-a) + col[1]*a);
      img.data[k+2] = Math.round(255*(1-a) + col[2]*a);
      img.data[k+3] = 255;
    }
    c.putImageData(img, 0, 0);
    f.pmap = pm;
    if(o.contour !== false){
      f.path = new Path2D();
      contourPath(f.path, pm, nx, ny, cv._w, cv._h, o.level ?? .5);
    }
  }
  ctx.drawImage(f.cv, 0, 0, cv._w, cv._h);
  if(o.contour !== false && f.path){
    ctx.save();
    ctx.strokeStyle = o.line || C.P;
    ctx.lineWidth = (o.lw || 1.8) * (o.u || 1); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.stroke(f.path);
    ctx.restore();
  }
  return f;
}
function contourPath(ctx,pm,nx,ny,w,h,level){
  const cw = w/nx, ch = h/ny;
  const px = i => (i+.5)*cw, py = j => (j+.5)*ch;
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){
    const v0=pm[j*nx+i], v1=pm[j*nx+i+1], v2=pm[(j+1)*nx+i+1], v3=pm[(j+1)*nx+i];
    const b0=v0>level, b1=v1>level, b2=v2>level, b3=v3>level;
    if(b0===b1 && b1===b2 && b2===b3) continue;
    const x0=px(i), x1=px(i+1), y0=py(j), y1=py(j+1);
    const e=[];
    if(b0!==b1) e.push([x0+(x1-x0)*(level-v0)/(v1-v0), y0]);
    if(b1!==b2) e.push([x1, y0+(y1-y0)*(level-v1)/(v2-v1)]);
    if(b2!==b3) e.push([x1+(x0-x1)*(level-v2)/(v3-v2), y1]);
    if(b3!==b0) e.push([x0, y1+(y0-y1)*(level-v3)/(v0-v3)]);
    if(e.length>=2){
      ctx.moveTo(e[0][0],e[0][1]); ctx.lineTo(e[1][0],e[1][1]);
      if(e.length===4){ ctx.moveTo(e[2][0],e[2][1]); ctx.lineTo(e[3][0],e[3][1]); }
    }
  }
}

/* line where wx*x + wy*y + b = level, extended far */
function isoLine(wx, wy, b, level){
  const n2 = wx*wx + wy*wy || 1e-6;
  const px = -(b-level)*wx/n2, py = -(b-level)*wy/n2;
  const n = Math.sqrt(n2), dx = -wy/n, dy = wx/n, R = 6;
  return [{x:px-dx*R, y:py-dy*R}, {x:px+dx*R, y:py+dy*R}];
}

  fx:'ŷ = mode{ yᵢ : xᵢ ∈ <b style="color:#F59E0B">N<sub>K</sub></b>(x) }',
  use:{ko:'<b>쓰임</b> 추천 · 이상 탐지 · 라벨이 적은 소규모 데이터',
       en:'<b>Use</b> recommenders · anomaly detection · small labelled datasets'},
  long:{ko:'새 점 x에서 모든 학습 점까지의 거리를 재고 가장 가까운 K개를 고릅니다. 분류는 다수결, 회귀는 평균입니다. K=1이면 점 하나하나를 외워 경계가 거칠고, K가 커지면 경계가 매끈해지지만 지역 구조를 놓칩니다. 배경은 KNN이 그리는 결정 영역이며, 점선 원은 K번째 이웃까지의 반경입니다. 확대 뷰에서 그래프를 클릭하면 쿼리 점을 옮길 수 있습니다.',
        en:'Measure the distance from the query point to every training point and keep the K nearest. Classification takes a vote, regression an average. K = 1 memorises each point (ragged boundary); larger K smooths the boundary but loses local structure. The background is the KNN decision field; the dashed circle marks the distance to the K-th neighbour. In focus view, click the plot to move the query.'},
  p:{k:5},
  params:[{k:'k', ko:'이웃 수 K', en:'neighbours K', min:1, max:15, step:1, fmt:v=>String(v)}],
  init(){ this.seed=newSeed(); this.data=this.gen(); this.begin(); },
  reset(){ this.seed=newSeed(); this.data=this.gen(); this.begin(); },
  gen(){
    const r=new RNG(this.seed);
    const specs=[[-1.05,.55,0],[-.95,-.80,0],[.10,.85,1],[1.00,.30,1],[.80,-.85,1]];
    let out=[];
    for(const [cx,cy,c] of specs) out=out.concat(makePts(r,15,cx,cy,.30,.28,0,c));
    return out;
  },
  begin(){
    this.path=[[-.20,.10],[.55,.45],[-.62,-.35],[.45,-.62],[-1.05,.05]];
    this.qi=0; this.q={x:this.path[0][0], y:this.path[0][1]};
    this.from={...this.q}; this.to={...this.q};
    this.ph='hold'; this.pt=0; this.nbr=[]; this.ns=0; this.compute();
    this.ns=this.p.k;
  },
  compute(){
    const ds=this.data.map(d=>({d, q:(d.x-this.q.x)**2+(d.y-this.q.y)**2}));
    ds.sort((a,b)=>a.q-b.q);
    this.nbr=ds.slice(0,this.p.k).map(o=>({...o.d, dist:Math.sqrt(o.q)}));
    this.rK=this.nbr.length?this.nbr[this.nbr.length-1].dist:0;
    this.vA=this.nbr.filter(n=>n.c===0).length;
    this.vB=this.nbr.filter(n=>n.c===1).length;
  },
  tick(dt){
    this.pt+=dt;
    if(this.ph==='hold'){ if(this.pt>=1.15) this.next(); }
    else if(this.ph==='move'){
      const k=clamp(this.pt/.75,0,1), e=easeIO(k);
      this.q={x:lerp(this.from.x,this.to.x,e), y:lerp(this.from.y,this.to.y,e)};
      if(k>=1){ this.ph='reveal'; this.pt=0; this.compute(); }
    } else if(this.ph==='reveal'){
      const k=clamp(this.pt/1.0,0,1);
      this.ns=Math.round(k*this.p.k);
      if(k>=1){ this.ph='hold'; this.pt=0; this.ns=this.p.k; }
    }
  },
  next(){
    this.from={...this.q};
    this.qi=(this.qi+1)%this.path.length;
    this.to={x:this.path[this.qi][0], y:this.path[this.qi][1]};
    this.ph='move'; this.pt=0; this.ns=0;
  },
  onParam(){ this.compute(); this.ns=this.p.k; this.ph='hold'; this.pt=0; },
  onCanvas(p){
    this.q={x:clamp(p.x,-2.2,2.2), y:clamp(p.y,-1.3,1.3)};
    this.path[this.qi]=[this.q.x,this.q.y];
    this.compute(); this.ns=this.p.k; this.ph='hold'; this.pt=0;
  },
  stats(){
    return [`K ${this.p.k} · ${this.vA}:${this.vB}`, `rad ${F(this.rK,2)} · p(B) ${F(this.vB/Math.max(1,this.nbr.length),2)}`];
  },
  draw(cv,big){
    const ctx=cv._ctx; if(!ctx) return;
    const t=tf(cv), u=U(cv);
    ctx.clearRect(0,0,cv._w,cv._h);
    const K=this.p.k, data=this.data;
    const key=`knn|${this.seed}|${K}`;
    paintField(ctx,cv,'knn',key,t,(x,y)=>{
      const ds=[];
      for(const d of data) ds.push([(d.x-x)**2+(d.y-y)**2, d.c]);
      ds.sort((a,b)=>a[0]-b[0]);
      let s=0; for(let i=0;i<K && i<ds.length;i++) s+=ds[i][1];
      return s/K;
    },{lw:2*u, u, base:.025, amp:.13, smooth:true});
    bg(ctx,cv,t,big);
    /* neighbours */
    const qp=t.f(this.q.x,this.q.y);
    if(this.nbr.length && this.ph!=='move'){
      const rr=this.rK*t.sc;
      if(rr>2){ ctx.save(); ctx.setLineDash([4*u,4*u]); ctx.strokeStyle='rgba(245,158,11,.55)'; ctx.lineWidth=1.4*u;
        ctx.beginPath(); ctx.arc(qp.x,qp.y,rr,0,TAU); ctx.stroke(); ctx.restore(); }
      const nShow=this.ph==='hold' ? this.nbr.length : Math.min(this.nbr.length, this.ns);
      for(let i=0;i<nShow;i++){
        const n=this.nbr[i], np=t.f(n.x,n.y);
        line(ctx,qp.x,qp.y,np.x,np.y, n.c? 'rgba(37,99,235,.55)':'rgba(239,68,68,.55)', 1.5*u);
      }
      for(let i=0;i<nShow;i++){
        const n=this.nbr[i], np=t.f(n.x,n.y);
        ring(ctx,np.x,np.y,6.2*u,C.Y,1.8*u);
      }
    }
    for(const d of this.data){ const p=t.f(d.x,d.y); dot(ctx,p.x,p.y,3.1*u, d.c?C.B:C.A); }
    /* query */
    dot(ctx,qp.x,qp.y,5.2*u,'#fff',C.ink,2*u);
    dot(ctx,qp.x,qp.y,2.0*u,C.ink,'',0);
    /* vote bars */
    const bw=52*u, bh=7*u, bx=cv._w-bw-12*u, by=12*u;
    bar(ctx,bx,by,bw,bh,this.vB/Math.max(1,this.vB+this.vA),C.B);
    bar(ctx,bx,by+bh+3*u,bw,bh,this.vA/Math.max(1,this.vB+this.vA),C.A);
    lab(ctx,`B ${this.vB}`,bx-5*u,by+bh/2,{size:8.5*u,color:C.B,align:'right'});
    lab(ctx,`A ${this.vA}`,bx-5*u,by+bh*1.5+3*u,{size:8.5*u,color:C.A,align:'right'});
    chip(ctx,cv,`K=${K}`,9*u,9*u);
  }
},

/* ============================== 05 · PCA ============================== */
{
  id:'pca', num:'05',
  names:{ko:['Principal Component Analysis','주성분 분석'], en:['Principal Component Analysis','']},
  fx:'C = 1/n XᵀX,  C<b style="color:#9331E9">u</b> = <b style="color:#F59E0B">λ</b><b style="color:#9331E9">u</b>',
  use:{ko:'<b>쓰임</b> 차원 축소 · 시각화 · 노이즈 제거 · 압축',
       en:'<b>Use</b> dimensionality reduction · visualisation · denoising · compression'},
  long:{ko:'데이터를 평균만큼 옮기고 공분산 C = XᵀX/n의 고유벡터를 구합니다. 가장 큰 고유값 λ₁의 방향이 PC1, 그 직교 방향이 PC2입니다. 점을 PC1에 정사영하면 2차원 정보를 1차원으로 줄이면서 분산을 최대로 보존합니다. 보라 축이 PC1, 주황 축이 PC2, 옅은 점선이 정사영 자취입니다.',
        en:'Centre the cloud, then take the eigenvectors of C = XᵀX/n. The direction of the largest eigenvalue λ₁ is PC1, its orthogonal partner PC2. Projecting onto PC1 compresses 2-D into 1-D while keeping the most variance. Purple is PC1, amber PC2, faint dashed lines are the projections.'},
  p:{n:120},
  params:[{k:'n', ko:'점 개수 n', en:'points n', min:40, max:240, step:10, fmt:v=>String(v)}],
  init(){ this.gen(); },
  reset(){ this.gen(); },
  gen(){
    const seed=newSeed(); this.seed=seed;
    const r=new RNG(seed), n=this.p.n, th=r.range(-1.25,1.25), sy=.34+.12*r.next();
    this.pts=makePts(r,n,0,0,.82,sy,th,0);
    let mx=0,my=0; for(const p of this.pts){ mx+=p.x; my+=p.y; } mx/=n; my/=n;
    let a=0,b=0,c=0; for(const p of this.pts){ const dx=p.x-mx, dy=p.y-my; a+=dx*dx; b+=dx*dy; c+=dy*dy; }
    a/=n; b/=n; c/=n;
    const tr=a+c, disc=Math.sqrt(((a-c)/2)**2+b*b);
    this.mean={x:mx,y:my}; this.a=a; this.b=b; this.c=c;
    this.l1=tr/2+disc; this.l2=Math.max(1e-3,tr/2-disc);
    this.ang=.5*Math.atan2(2*b, a-c);
    this.u1={x:Math.cos(this.ang), y:Math.sin(this.ang)};
    this.ph='axes'; this.pt=0;
    this.a0=this.ang+(r.next()<.5?-1:1)*r.range(.75,1.45);
  },
  tick(dt){
    this.pt+=dt;
    if(this.ph==='axes' && this.pt>=1.55){ this.ph='proj'; this.pt=0; }
    else if(this.ph==='proj' && this.pt>=1.55){ this.ph='hold'; this.pt=0; }
    else if(this.ph==='hold' && this.pt>=1.25){ this.gen(); }
  },
  onParam(){ this.gen(); },
  stats(){
    return [`PC1 ${Math.round(this.l1/(this.l1+this.l2)*100)}%`, `λ₁ ${F(this.l1,2)} · λ₂ ${F(this.l2,2)} · n ${this.p.n}`];
  },
  draw(cv,big){
    const ctx=cv._ctx; if(!ctx) return;
    const t=tf(cv), u=U(cv);
    ctx.clearRect(0,0,cv._w,cv._h);
    bg(ctx,cv,t,big);
    const e = this.ph==='axes' ? easeIO(clamp(this.pt/1.55,0,1)) : 1;
    let ang = this.ang + (((this.a0-this.ang+Math.PI*3)%TAU)-Math.PI)*(1-e);
    const k = this.ph==='proj' ? easeIO(clamp(this.pt/1.5,0,1)) : (this.ph==='hold'?1:0);
    const u1={x:Math.cos(this.ang), y:Math.sin(this.ang)};
    const m=this.mean;
    /* projection */
    if(k>0.001){
      for(const p of this.pts){
        const dx=p.x-m.x, dy=p.y-m.y, s=dx*u1.x+dy*u1.y;
        const qx=m.x+u1.x*s, qy=m.y+u1.y*s;
        const px=lerp(p.x,qx,k), py=lerp(p.y,qy,k);
        const A=t.f(p.x,p.y), B=t.f(px,py);
        if(k<.995) line(ctx,A.x,A.y,B.x,B.y,'rgba(147,49,233,'+(0.05+0.16*(1-k))+')',1*u,[2*u,3*u]);
      }
    }
    for(const p of this.pts){
      const dx=p.x-m.x, dy=p.y-m.y, s=dx*u1.x+dy*u1.y;
      const px=lerp(p.x, m.x+u1.x*s, k), py=lerp(p.y, m.y+u1.y*s, k);
      const q=t.f(px,py);
      dot(ctx,q.x,q.y,2.5*u, k>.01?'rgba(147,49,233,.85)':'rgba(148,163,184,.9)','',0);
    }
    /* axes */
    const dirA={x:Math.cos(ang), y:Math.sin(ang)};
    const dirB={x:-dirA.y, y:dirA.x};
    const L1=Math.min(2.25, .55+.95*Math.sqrt(this.l1));
    const L2=Math.min(1.5, .30+.95*Math.sqrt(this.l2));
    const M=t.f(m.x,m.y);
    const A1=t.f(m.x+dirA.x*L1, m.y+dirA.y*L1), A2=t.f(m.x-dirA.x*L1, m.y-dirA.y*L1);
    const B1=t.f(m.x+dirB.x*L2, m.y+dirB.y*L2), B2=t.f(m.x-dirB.x*L2, m.y-dirB.y*L2);
    line(ctx,A2.x,A2.y,A1.x,A1.y,C.P,2.3*u);
    line(ctx,B2.x,B2.y,B1.x,B1.y,C.Y,2.0*u);
    dot(ctx,M.x,M.y,3.2*u,C.ink);
    if(big){
      const pct=Math.round(this.l1/(this.l1+this.l2)*100);
      lab(ctx,`PC1 · ${pct}%`, A1.x, A1.y-11*u, {size:10.5*u, color:C.P});
      lab(ctx,`PC2 · ${100-pct}%`, B1.x, B1.y-11*u, {size:10.5*u, color:C.Y});
    }
    chip(ctx,cv, `n ${this.p.n}`, 9*u, 9*u);
  }
},

/* ============================== 06 · k-Means ============================== */
{
  id:'kmeans', num:'06',
  names:{ko:['k-Means Clustering','k-평균 군집'], en:['k-Means Clustering','']},
  fx:'argmin Σₖ Σ<sub>x∈Sₖ</sub> ‖x − <b style="color:#9331E9">μ</b><sub>k</sub>‖²',
  use:{ko:'<b>쓰임</b> 고객 세분화 · 이미지 색상 양자화 · 압축',
       en:'<b>Use</b> customer segmentation · colour quantisation · compression'},
  long:{ko:'① 각 점을 가장 가까운 중심 μ에 배정하고 ② 각 중심을 배정된 점들의 평균으로 옮깁니다. 이 두 단계를 반복하면 관성 Σ‖x − μ‖²이 단조 감소하며 수렴합니다. 초기 중심 위치에 따라 지역 최적해가 달라질 수 있어 실제로는 k-means++ 같은 초기화를 씁니다. 수렴하면 새 초기 중심으로 다시 시작합니다.',
        en:'① Assign every point to its nearest centroid, ② move each centroid to the mean of its points. Repeating these two steps decreases the inertia Σ‖x − μ‖² monotonically. Because random initialisation can land in a local optimum, real implementations use k-means++. When it converges, the animation restarts from new centroids.'},
  p:{k:3},
  params:[{k:'k', ko:'군집 수 k', en:'clusters k', min:2, max:5, step:1, fmt:v=>String(v)}],
  init(){ this.seed=newSeed(); this.gen(); this.cyc=0; this.begin(); },
  reset(){ this.seed=newSeed(); this.gen(); this.begin(); },
  gen(){
    const r=new RNG(this.seed);
    const specs=[[-1.02,.52],[.96,-.22],[-.28,-.88]];
    let out=[]; for(const s of specs) out=out.concat(makePts(r,42,s[0],s[1],.27,.27,0,0));
    this.data=out;
  },
  begin(){
    const r=new RNG(this.seed + (this.cyc=(this.cyc||0)+1)*977);
    this.cents=[];
    for(let i=0;i<this.p.k;i++) this.cents.push({x:r.range(-1.45,1.45), y:r.range(-1.0,1.0)});
    this.ph='assign'; this.pt=0; this.it=0; this.inertia=0;
    this.assignNow();
    this.from=this.cents.map(c=>({...c}));
  },
  assignNow(){
    const k=this.cents.length, sums=this.cents.map(()=>({x:0,y:0,n:0}));
    let inertia=0;
    this.labels=this.data.map(p=>{
      let bi=0, bd=Infinity;
      this.cents.forEach((c,i)=>{ const d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;bi=i;} });
      sums[bi].x+=p.x; sums[bi].y+=p.y; sums[bi].n++; inertia+=bd;
      return bi;
    });
    this.target=this.cents.map((c,i)=> sums[i].n? {x:sums[i].x/sums[i].n, y:sums[i].y/sums[i].n} : {...c});
    this.inertia=inertia;
  },
  tick(dt){
    this.pt+=dt;
    if(this.ph==='assign'){
      if(this.pt>=.70){ this.ph='move'; this.pt=0; this.from=this.cents.map(c=>({...c})); }
    } else if(this.ph==='move'){
      const e=easeIO(clamp(this.pt/.70,0,1));
      this.cents=this.from.map((f,i)=>({x:lerp(f.x,this.target[i].x,e), y:lerp(f.y,this.target[i].y,e)}));
      if(this.pt>=.70){
        this.it++;
        const sh=Math.max(0,...this.from.map((f,i)=>Math.hypot(f.x-this.target[i].x, f.y-this.target[i].y)));
        if(sh<.02 || this.it>=12){ this.ph='hold'; this.pt=0; }
        else { this.assignNow(); this.ph='assign'; this.pt=0; }
      }
    } else if(this.ph==='hold'){
      if(this.pt>=1.4){ this.cyc++; this.begin(); }
    }
  },
  onParam(){ this.cyc=0; this.begin(); },
  stats(){
    return [`k ${this.p.k} · ${this.it}`, `inertia ${F(this.inertia,1)}`];
  },
  draw(cv,big){
    const ctx=cv._ctx; if(!ctx) return;
    const t=tf(cv), u=U(cv);
    ctx.clearRect(0,0,cv._w,cv._h);
    bg(ctx,cv,t,big);
    const C0=t.f(this.cents[0].x,this.cents[0].y);
    /* assignment lines */
    ctx.save(); ctx.strokeStyle='rgba(17,24,39,.075)'; ctx.lineWidth=1*u;
    this.data.forEach((p,i)=>{
      const c=this.cents[this.labels[i]]; if(!c) return;
      const A=t.f(p.x,p.y), B=t.f(c.x,c.y);
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    });
    ctx.restore();
    /* points */
    this.data.forEach((p,i)=>{
      const q=t.f(p.x,p.y), col=PAL[this.labels[i]%PAL.length];
      dot(ctx,q.x,q.y,3.0*u,col,'rgba(255,255,255,.85)',1.2*u);
    });
    /* centroids */
    this.cents.forEach((c,i)=>{
      const q=t.f(c.x,c.y), col=PAL[i%PAL.length];
      dot(ctx,q.x,q.y,7.2*u,'#fff',col,2.8*u);
      dot(ctx,q.x,q.y,2.2*u,col,'',0);
      if(big) lab(ctx,`μ${i+1}`, q.x, q.y-10.5*u, {size:9.5*u, color:col});
    });
    const txt=this.ph==='assign' ? (ko()?'① 할당':'① assign') : this.ph==='move' ? (ko()?'② 이동':'② update') : (ko()?'✓ 수렴':'✓ converged');
    chip(ctx,cv, txt, 9*u, 9*u, {color:this.ph==='hold'?C.G:C.ink});
    if(big) lab(ctx, `${ko()?'반복':'iter'} ${this.it}`, 9*u+6*u, 9*u+23*u, {size:9*u, color:C.mute, align:'left', halo:false});
  }
},

/* ============================== 07 · Decision Tree ============================== */
{
  id:'tree', num:'07',
  names:{ko:['Decision Tree','결정 트리'], en:['Decision Tree','']},
  fx:'Gini = 1 − Σ pᵢ² ,  split = argmin weighted Gini',
  use:{ko:'<b>쓰임</b> 규칙이 필요한 업무 · 스코어카드 · 설명 가능 모델',
       en:'<b>Use</b> rule-based decisions · scorecards · interpretable models'},
  long:{ko:'각 노드에서 축 하나와 임계값을 골라 공간을 반으로 나눕니다. 좋은 분할은 가중 지니 불순도 Σ(nₖ/n)(1 − Σpᵢ²)를 가장 많이 낮추는 분할입니다. 깊이가 커질수록 영역이 잘게 나뉘고 훈련 정확도는 오르지만 과적합 위험도 커집니다. 분할선이 하나씩 나타난 뒤 새 데이터로 다시 시작합니다.',
        en:'Each node picks one axis and a threshold, cutting its region in two. The best split minimises the weighted Gini impurity Σ(nₖ/n)(1 − Σpᵢ²). Deeper trees carve finer regions and fit the training data better, at the cost of overfitting. Splits appear one at a time, then the cycle restarts on fresh data.'},
  p:{depth:3},
  params:[{k:'depth', ko:'최대 깊이', en:'max depth', min:1, max:6, step:1, fmt:v=>String(v)}],
  init(){ this.seed=newSeed(); this.build(); },
  reset(){ this.seed=newSeed(); this.build(); },
  build(){
    const r=new RNG(this.seed);
    this.data=[];
    const specs=[[-.85,.55,0],[.80,-.60,0],[-.85,-.60,1],[.85,.60,1]];
    for(const [cx,cy,c] of specs) this.data=this.data.concat(makePts(r,22,cx,cy,.26,.26,0,c));
    this.root=buildTree(this.data,0,this.p.depth,{x0:-2.4,x1:2.4,y0:-1.5,y1:1.5});
    this.nodes=collectTree(this.root);
    this.leaves=countLeaves(this.root);
    this.acc=treeAccuracy(this.root,this.data);
    this.pt=0; this.rev=0;
  },
  tick(dt){
    this.pt+=dt;
    const want=Math.min(this.nodes.length, Math.floor(this.pt/.34));

    if(this.pt > this.nodes.length*.34 + 1.7){ this.seed=newSeed(); this.build(); }
  },
  onParam(){ this.build(); },
  stats(){
    return [`d${this.p.depth} · ${this.leaves} ${ko()?'잎':'leaf'}`, `${ko()?'분할':'splits'} ${this.rev}/${this.nodes.length} · acc ${Math.round(this.acc*100)}%`];
  },
  draw(cv,big){
    const ctx=cv._ctx; if(!ctx) return;
    const t=tf(cv), u=U(cv);
    ctx.clearRect(0,0,cv._w,cv._h);
    const key=`tree|${this.seed}|${this.p.depth}|${this.rev}`;
    paintField(ctx,cv,'tree',key,t,(x,y)=>treeP(this.root,x,y,this.rev),{lw:2*u, u, base:.025, amp:.12});
    bg(ctx,cv,t,big);
    this.nodes.forEach(n=>{

      else { const A=t.f(b.x0,n.thr), B=t.f(b.x1,n.thr); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
      ctx.stroke(); ctx.restore();
      if(big){
        if(n.axis===0){
          const A=t.f(n.thr, b.y0+0.10);

/* ============================== 08 · Random Forest ============================== */
{

  names:{ko:['Random Forest','랜덤 포레스트'], en:['Random Forest','']},

  long:{ko:'부트스트랩(중복 허용 재표본)으로 데이터를 T개 만들고, 각 트리는 노드마다 무작위로 고른 특징만 사용합니다. 이렇게 만든 트리들의 예측을 평균 내면 분산이 줄고 경계가 부드러워집니다. 회색 얇은 선은 개별 트리의 분할, 보라색 곡선이 앙상블의 결정 경계입니다. 트리가 하나씩 추가되며 경계가 다듬어지는 것을 볼 수 있습니다.',
        en:'Draw T bootstrap resamples and let each tree use only a random subset of features at every node. Averaging those trees cuts variance and smooths the boundary. Thin grey lines are individual tree splits; the purple curve is the ensemble. Watch the boundary get refined as trees join one by one.'},
  p:{T:7},
  params:[{k:'T', ko:'트리 수 T', en:'trees T', min:3, max:15, step:1, fmt:v=>String(v)}],
  MAXD:4,
  init(){ this.seed=newSeed(); this.build(); },
  reset(){ this.seed=newSeed(); this.build(); },
  gen(){
    const r=new RNG(this.seed), pts=[];
    for(let i=0;i<64;i++){ const a=r.range(0,TAU), rad=.88+r.g()*.16; pts.push({x:Math.cos(a)*rad, y:Math.sin(a)*rad*.92, c:0}); }
    for(let i=0;i<52;i++){ const a=r.range(0,TAU), rad=Math.abs(r.g())*.33; pts.push({x:Math.cos(a)*rad, y:Math.sin(a)*rad*.92, c:1}); }
    return pts;
  },
  build(){
    const r=new RNG(this.seed);
    this.data=this.gen();
    const n=this.data.length, T=this.p.T;
    this.trees=[];
    for(let t=0;t<T;t++){
      const bag=[];
      for(let i=0;i<n;i++) bag.push(this.data[Math.floor(r.next()*n)]);
      this.trees.push(buildRandTree(bag,0,this.MAXD,r,{x0:-2.4,x1:2.4,y0:-1.5,y1:1.5}));

  },
  onParam(){ this.seed=newSeed(); this.build(); },
  active(){ return Math.max(1, Math.min(this.p.T, Math.floor(this.act)||1)); },
  ens(x,y,nT){ let s=0; for(let t=0;t<nT;t++) s+=treeF(this.trees[t],x,y); return s/nT; },
  stats(){
    const nT=this.active();
    let ok=0; for(const d of this.data){ if((this.ens(d.x,d.y,nT)>=.5?1:0)===d.c) ok++; }
    return [`T ${nT}/${this.p.T}`, `acc ${Math.round(ok/this.data.length*100)}% · ${ko()?'깊이':'depth'} ${this.MAXD}`];

    const t=tf(cv), u=U(cv);

    paintField(ctx,cv,'forest',`fr|${this.seed}|${nT}|${this.p.T}`,t,(x,y)=>this.ens(x,y,nT),{lw:2.1*u, u, base:.02, amp:.09, smooth:2});

      for(const nd of tr.nodes){

        if(nd.axis===0){ const A=t.f(nd.thr,b.y0), B=t.f(nd.thr,b.y1); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
        else { const A=t.f(b.x0,nd.thr), B=t.f(b.x1,nd.thr); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
      }
      ctx.stroke(); ctx.restore();
    }
    for(const d of this.data){ const p=t.f(d.x,d.y); dot(ctx,p.x,p.y,2.5*u, d.c?C.B:C.A, 'rgba(255,255,255,.55)', 1*u); }
    /* tree tally (under the chip) */
    const n=this.p.T, gap=8.5*u, sz=5*u, y0=31*u, x0=10*u;
    for(let i=0;i<n;i++){
      ctx.fillStyle = i<nT ? C.Y : '#E5E7EB';
      ctx.fillRect(x0+i*gap, y0, sz, sz);
    }
    lab(ctx, `${ko()?'트리':'trees'} ${nT}`, x0+n*gap+3*u, y0+sz/2, {size:8.5*u, color:C.mute, align:'left', halo:false});
    chip(ctx,cv, `${ko()?'앙상블':'ensemble'} ${nT}/${n}`, 9*u, 9*u);
  }
},

/* ============================== 09 · Naive Bayes ============================== */
{
  id:'nb', num:'09',
  names:{ko:['Gaussian Naive Bayes','가우시안 나이브 베이즈'], en:['Gaussian Naive Bayes','']},
  fx:'P(y|x) ∝ P(y) Πⱼ N(xⱼ | <b style="color:#9331E9">μ</b><sub>yj</sub>, <b style="color:#F59E0B">σ²</b><sub>yj</sub>)',
  use:{ko:'<b>쓰임</b> 스팸 필터 · 문서 분류 · 빠른 베이스라인',
       en:'<b>Use</b> spam filtering · document classification · fast baselines'},
  long:{ko:'클래스마다 특징이 가우시안이라고 가정하고 평균·분산을 데이터에서 추정합니다. 두 클래스의 로그 우도 + 로그 사전확률을 비교해 더 큰 쪽으로 분류하며, 그 차이가 0인 곳이 결정 경계입니다. 조건부 독립 가정 덕분에 학습은 평균·분산 계산 한 번으로 끝나고 경계는 2차 곡선이 됩니다. 점선 타원은 각 클래스의 1σ·2σ 등고선입니다.',
        en:'Assume each feature is Gaussian per class and estimate the means and variances from data. Compare log-likelihood plus log-prior for the two classes and pick the larger; where the difference is zero lies the boundary. Conditional independence makes training a single pass of mean/variance and the boundary a quadratic curve. Dashed ellipses are the 1σ and 2σ contours of each class.'},
  p:{spread:1.0},
  params:[{k:'spread', ko:'클래스 퍼짐', en:'class spread', min:.6, max:1.8, step:.1, fmt:v=>v.toFixed(1)}],
  init(){ this.gen(); },
  reset(){ this.gen(); },
  gen(){
    const seed=newSeed(); this.seed=seed;
    const r=new RNG(seed), s=this.p.spread;
    this.data=makePts(r,54,-.68,.14,.52,.26,.55*s,0).concat(makePts(r,54,.66,-.14,.45,.30,-.60*s,1));
    this.fit();
    this.pt=0;
  },
  fit(){
    const cls=[0,1].map(c=>{
      const pts=this.data.filter(p=>p.c===c);
      const n=pts.length;
      let mx=0,my=0; for(const p of pts){ mx+=p.x; my+=p.y; } mx/=n; my/=n;
      let a=0,b=0,d=0; for(const p of pts){ const dx=p.x-mx, dy=p.y-my; a+=dx*dx; b+=dx*dy; d+=dy*dy; }
      a=a/n+1e-3; b=b/n; d=d/n+1e-3;
      const det=a*d-b*b, inv=[d/det, -b/det, a/det];
      return {m:{x:mx,y:my}, a,b,d, det, inv, logdet:Math.log(Math.max(det,1e-9)), prior:Math.log(n/this.data.length)};
    });
    this.cls=cls;
  },
  lp(k,x,y){
    const c=this.cls[k], dx=x-c.m.x, dy=y-c.m.y;
    const q=c.inv[0]*dx*dx + 2*c.inv[1]*dx*dy + c.inv[2]*dy*dy;
    return -.5*q -.5*c.logdet + c.prior;
  },
  tick(dt){ this.pt+=dt; if(this.pt>4.4) this.pt=0; this.pv=this.probe(); },
  onParam(){ this.gen(); },
  probe(){
    const u=(this.pt%4.4)/4.4;
    const x=-2.15+4.3*u, y=.52*Math.sin(x*1.9+.4);
    const l0=this.lp(0,x,y), l1=this.lp(1,x,y);
    const mx=Math.max(l0,l1);
    const p1=Math.exp(l1-mx)/(Math.exp(l0-mx)+Math.exp(l1-mx));
    return {x,y,p1,l0,l1};
  },
  stats(){
    const p = this.pv || this.probe();
    return [`P(B|x) ${F(p.p1,2)}`, `log-odds ${F(p.l1-p.l0,2)} · ${ko()?'퍼짐':'spread'} ${this.p.spread.toFixed(1)}`];
  },
  draw(cv,big){
    const ctx=cv._ctx; if(!ctx) return;
    const t=tf(cv), u=U(cv);
    ctx.clearRect(0,0,cv._w,cv._h);
    paintField(ctx,cv,'nb',`nb|${this.seed}|${this.p.spread}`,t,(x,y)=>{
      const l0=this.lp(0,x,y), l1=this.lp(1,x,y); return sig(l1-l0);
    },{lw:2.1*u, u, base:.02, amp:.13});
    bg(ctx,cv,t,big);
    const grow=easeOut(clamp(this.pt/.9,0,1));
    this.cls.forEach((c,i)=>{
      const ang=.5*Math.atan2(2*c.b, c.a-c.d);
      const l1=(c.a+c.d)/2+Math.sqrt(((c.a-c.d)/2)**2+c.b*c.b);
      const l2=Math.max(1e-4,(c.a+c.d)/2-Math.sqrt(((c.a-c.d)/2)**2+c.b*c.b));
      const M=t.f(c.m.x,c.m.y);
      [1,2].forEach((s,si)=>{
        ctx.save();
        ctx.setLineDash([4*u,4*u]); ctx.lineWidth=(si?1.1:1.6)*u;
        ctx.strokeStyle = i? 'rgba(37,99,235,'+(si?.45:.65)+')' : 'rgba(239,68,68,'+(si?.45:.65)+')';
        ctx.beginPath();
        ctx.ellipse(M.x, M.y, Math.sqrt(l1)*s*t.sc*grow, Math.sqrt(l2)*s*t.sc*grow, -ang, 0, TAU);
        ctx.stroke(); ctx.restore();
      });
      dot(ctx,M.x,M.y,3.2*u, i?C.B:C.A);
    });
    for(const d of this.data){ const p=t.f(d.x,d.y); dot(ctx,p.x,p.y,2.6*u, d.c?C.B:C.A, 'rgba(255,255,255,.6)', 1*u); }
    const pr=this.pv||this.probe(), q=t.f(pr.x,pr.y);
    dot(ctx,q.x,q.y,4.6*u,'#fff',C.ink,2*u);
    dot(ctx,q.x,q.y,1.8*u,C.ink,'',0);
    /* posterior bars */
    const bx=cv._w-96*u, by=cv._h-38*u, bw=62*u, bh=7*u;
    bar(ctx,bx,by,bw,bh,pr.p1,C.B);
    bar(ctx,bx,by+bh+9*u,bw,bh,1-pr.p1,C.A);
    lab(ctx,`B ${(pr.p1*100).toFixed(0)}%`, bx-5*u, by+bh/2, {size:8.5*u,color:C.B,align:'right'});
    lab(ctx,`A ${((1-pr.p1)*100).toFixed(0)}%`, bx-5*u, by+bh+9*u+bh/2, {size:8.5*u,color:C.A,align:'right'});
    chip(ctx,cv,'p(B|x)', 9*u, 9*u);
  }
}
];

/* ============================================================================
   tree helpers (hoisted function declarations)
   ========================================================================= */
function treeGini(p1){ return 1 - p1*p1 - (1-p1)*(1-p1); }
function buildTree(pts, depth, maxD, box){
  const n = pts.length, s = pts.reduce((a,p)=>a+p.c, 0), p1 = s/Math.max(1,n);
  const node = {n, p1, box, gini:treeGini(p1), leaf:true};
  if(depth>=maxD || n<8 || node.gini<1e-4) return node;
  let best = null;
  for(const axis of [0,1]){
    const vals = pts.map(p=>axis?p.y:p.x).sort((a,b)=>a-b);
    const nq = Math.min(14, vals.length-1);
    for(let q=1;q<=nq;q++){
      const idx = Math.floor(vals.length*q/(nq+1));
      const thr = (vals[idx-1]+vals[idx])/2;
      if(!isFinite(thr)) continue;
      let l=0, ls=0;
      for(const p of pts){ if((axis?p.y:p.x)<=thr){ l++; ls+=p.c; } }
      const rr = n-l;
      if(l<4 || rr<4) continue;
      const g = (l*treeGini(ls/l) + rr*treeGini((s-ls)/rr))/n;
      if(!best || g<best.g) best = {axis, thr, g, l};
    }
  }
  if(!best || best.g >= node.gini-1e-4) return node;
  const L=[], R=[];
  for(const p of pts){ ((best.axis?p.y:p.x)<=best.thr ? L:R).push(p); }
  const b1={...box}, b2={...box};
  if(best.axis===0){ b1.x1=best.thr; b2.x0=best.thr; } else { b1.y1=best.thr; b2.y0=best.thr; }
  node.leaf=false; node.axis=best.axis; node.thr=best.thr;
  node.left = buildTree(L, depth+1, maxD, b1);
  node.right = buildTree(R, depth+1, maxD, b2);
  return node;
}
function collectTree(root){
  const out=[], q=[root]; let o=0;
  while(q.length){
    const n=q.shift();
    if(n.leaf) continue;
    n.o=o++; out.push(n);
    q.push(n.left, n.right);
  }
  return out;
}
function countLeaves(n){ return n.leaf ? 1 : countLeaves(n.left)+countLeaves(n.right); }
function treeP(node,x,y,rev){
  while(!node.leaf && node.o<rev){
    node = ((node.axis===0?x:y) <= node.thr) ? node.left : node.right;
  }
  return node.leaf ? node.p1 : node.p1;
}
function treeF(node,x,y){
  while(!node.leaf) node = ((node.axis===0?x:y) <= node.thr) ? node.left : node.right;
  return node.p1;
}
function treeAccuracy(root,data){
  let ok=0; for(const d of data){ if((treeF(root,d.x,d.y)>=.5?1:0)===d.c) ok++; }
  return ok/data.length;
}
function buildRandTree(pts, depth, maxD, r, box){
  const n=pts.length, s=pts.reduce((a,p)=>a+p.c,0), p1=s/Math.max(1,n);
  const node={n,p1,box,leaf:true,nodes:[]};
  if(depth>=maxD || n<7 || p1<=0 || p1>=1) return node;
  let best=null;
  for(let k=0;k<6;k++){
    const axis = r.next()<.5?0:1;
    const a=pts[Math.floor(r.next()*n)], b=pts[Math.floor(r.next()*n)];
    const va=axis?a.y:a.x, vb=axis?b.y:b.x;
    if(va===vb) continue;
    const thr=(va+vb)/2;
    let l=0, ls=0;
    for(const p of pts){ const v=axis?p.y:p.x; if(v<=thr){ l++; ls+=p.c; } }
    if(l<4 || n-l<4) continue;
    const g=(l*treeGini(ls/l)+(n-l)*treeGini((s-ls)/(n-l)))/n;
    if(!best || g<best.g) best={axis,thr,g};
  }
  if(!best) return node;
  const L=[], R=[];
  for(const p of pts){ ((best.axis?p.y:p.x)<=best.thr ? L:R).push(p); }
  const b1={...box}, b2={...box};
  if(best.axis===0){ b1.x1=best.thr; b2.x0=best.thr; } else { b1.y1=best.thr; b2.y0=best.thr; }
  node.leaf=false; node.axis=best.axis; node.thr=best.thr;
  node.left=buildRandTree(L,depth+1,maxD,r,b1);
  node.right=buildRandTree(R,depth+1,maxD,r,b2);
  node.nodes=[node].concat(node.left.nodes||[], node.right.nodes||[]);
  return node;
}

/* ============================================================================
   Language / UI sync
   ========================================================================= */
function applyLang(){
  const L = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-k]').forEach(n=>{
    const k = n.dataset.k; if(L[k] !== undefined) n.textContent = L[k];
  });
  ALGS.forEach(a=>{
    const [en, kor] = a.names.ko;
    const name = S.lang === 'ko' ? en : a.names.en[0];
    const sub  = S.lang === 'ko' ? (a.names.ko[1]||'') : (a.names.en[1]||'');
    a.el.ttl.innerHTML = name + (sub ? `<small>${sub}</small>` : '');
    a.el.fx.innerHTML = a.fx;
    a.el.use.innerHTML = a.use[S.lang];
    a.el.long.innerHTML = a.long[S.lang];
    const bb = a.el.card.querySelector('.backbtn'); bb.textContent = L.back;
    a.el.card.querySelector('.prev').textContent = L.prev;
    a.el.card.querySelector('.next').textContent = L.next;
    a.el.navmid.textContent = `${a.i+1} ${L.of} ${ALGS.length}`;
    a.el.params.querySelectorAll('.prm').forEach(w=>{
      const p = w._p;
      w.querySelector('.pn').textContent = p[S.lang];
      w.querySelector('.pv').textContent = p.fmt(a.p[p.k]);
      w._inp.value = a.p[p.k];
    });
  });
  $('#lang').textContent = L.lang;
  syncPlay();
  syncView();
  buildModal();
}
function syncPlay(){
  const b = $('#play'), L = T[S.lang];
  b.textContent = S.playing ? L.play : L.paused;
  b.classList.toggle('on', S.playing);
}
function syncView(){
  $('#view').textContent = S.focus ? T[S.lang].viewFocus : T[S.lang].viewGrid;
  $('#view').classList.toggle('acc', !!S.focus);
}

/* ============================================================================
   Focus mode
   ========================================================================= */
function openFocus(id){
  const a = byId[id]; if(!a) return;
  S.focus = id;
  document.body.classList.add('focus');
  ALGS.forEach(x=>x.el.card.classList.toggle('focused', x.id === id));
  syncView();
  try { a.el.card.scrollIntoView({block:'start'}); } catch(e){}
  a.el.card.querySelector('.backbtn').textContent = T[S.lang].back;
  requestAnimationFrame(()=>{ fit(a.cv); });
  a.focusIn && a.focusIn();
}
function closeFocus(){
  const id = S.focus; if(!id) return;
  S.focus = null;
  document.body.classList.remove('focus');
  ALGS.forEach(x=>x.el.card.classList.remove('focused'));
  syncView();
  requestAnimationFrame(()=>{ ALGS.forEach(x=>fit(x.cv)); });
}
function stepFocus(dir){
  if(!S.focus) return;
  const i = byId[S.focus].i;
  const j = (i + dir + ALGS.length) % ALGS.length;
  openFocus(ALGS[j].id);
}

/* ============================================================================
   Modal
   ========================================================================= */
function buildModal(){
  const L = T[S.lang], box = $('#mbody');
  box.innerHTML = ALGS.map(a=>{
    const en = a.names.en[0], kor = a.names.ko[1];
    const nm = S.lang==='ko' ? en : en;
    const sm = S.lang==='ko' ? kor : '';
    const prm = a.params.map(p=>p[S.lang] + ' ' + p.fmt(a.p[p.k])).join(' · ');
    return `<div class="mrow"><div class="mnum">${a.num}</div><div>`+
      `<div class="mname">${nm}${sm?`<small>${sm}</small>`:''}</div>`+
      `<div class="mfx">${a.fx}</div>`+
      `<div class="mdesc">${a.long[S.lang]}</div>`+
      `<div class="mprm">${prm}</div></div></div>`;
  }).join('');
}
function openModal(){
  buildModal();
  document.body.classList.add('modal-open');
  $('#modal').setAttribute('aria-hidden','false');
}
function closeModal(){
  document.body.classList.remove('modal-open');
  $('#modal').setAttribute('aria-hidden','true');
}

/* ============================================================================
   Controls
   ========================================================================= */
$('#play').addEventListener('click', ()=>{ S.playing = !S.playing; syncPlay(); });
$('#reset').addEventListener('click', ()=>{
  ALGS.forEach(a=>{ a.reset(); });
  if(S.focus){ requestAnimationFrame(()=>fit(byId[S.focus].cv)); }
});
$('#speed').addEventListener('input', e=>{
  S.speed = +e.target.value;
  $('#spv').textContent = S.speed.toFixed(2).replace(/0$/,'') + '×';
});
$('#view').addEventListener('click', ()=>{ S.focus ? closeFocus() : openFocus(ALGS[0].id); });
$('#lang').addEventListener('click', ()=>{ S.lang = S.lang==='ko' ? 'en' : 'ko'; applyLang(); });
$('#help').addEventListener('click', openModal);
$('#mclose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e=>{ if(e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ if(document.body.classList.contains('modal-open')) closeModal(); else closeFocus(); }
  else if(e.key === ' ' && !e.target.matches('input,textarea,button')){ e.preventDefault(); S.playing=!S.playing; syncPlay(); }
  else if(e.key === 'ArrowRight' && S.focus){ stepFocus(1); }
  else if(e.key === 'ArrowLeft' && S.focus){ stepFocus(-1); }
  else if((e.key === 'g' || e.key === 'G') ){ S.focus ? closeFocus() : openFocus(ALGS[0].id); }
});

/* ============================================================================
   Boot
   ========================================================================= */
ALGS.forEach(a=>{ a.init(); fit(a.cv); });
applyLang();

let lastTs = 0, footAcc = 0;
function frame(ts){
  const raw = Math.min(.05, (ts - (lastTs||ts))/1000); lastTs = ts;
  const dt = raw * S.speed;
  footAcc += raw;
  const doFoot = footAcc > .12;
  if(doFoot) footAcc = 0;
  for(const a of ALGS){
    const visible = !S.focus || S.focus === a.id;
    if(!visible) continue;
    if(S.playing) a.tick(dt);
    if(a.cv._w) a.draw(a.cv, S.focus === a.id);
    if(doFoot){
      const st = a.stats();
      a.el.val.textContent = st[0];
      a.el.sub.textContent = st[1];
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
